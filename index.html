<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial - FindFlat</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/home.css">
</head>

<body>

    <!-- Navbar: adicionado pelo JS -->
    <div id="navbar-js"></div>

    <main class="home-page container">
        <h1>Meus Favoritos</h1>

        <section class="favorites-table container">
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Cidade</th>
                        <th>Morada</th>
                        <th>Nº</th>
                        <th>Área (m²)</th>
                        <th>AC</th>
                        <th>Ano</th>
                        <th>Valor da renda (€)</th>
                        <th>Data disponível</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="favorites-body"></tbody>
            </table>
        </section>
    </main>

    <!-- Footer: adicionado pelo JS -->
    <div id="footer-js"></div>

    <script src="js/data.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
